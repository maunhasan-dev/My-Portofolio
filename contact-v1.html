<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Maunhasan</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style-v4.css">

  <style>
    /* Style KHUSUS untuk halaman Contact saja. */

    .contact-hero {
      text-align: center;
      padding: var(--space-xl) 0;
    }
    .contact-hero p.subtitle {
      max-width: 460px;
      margin: var(--space-sm) auto var(--space-lg);
      color: var(--color-text-muted);
    }

    /* Ikon sosial versi BESAR, khusus halaman ini -- beda
       dari .footer-icons yang kecil (itu tetap dipakai di
       halaman lain lewat style-v4.css). Di sini kita bikin
       versi lebih besar karena ini jadi pusat perhatian
       halaman Contact. */
    .contact-icons {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: var(--space-lg);
      flex-wrap: wrap;
    }
    .contact-icons a {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 56px;
      height: 56px;
      border-radius: var(--radius);
      border: 1px solid var(--color-border);
      color: var(--color-text-muted);
      transition: all 0.2s ease;
    }
    .contact-icons a:hover {
      border-color: var(--color-primary);
      color: var(--color-primary);
      transform: translateY(-3px);
    }
    .contact-icons svg {
      width: 24px;
      height: 24px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.6;
    }
  </style>
</head>
<body>

  <div class="container">

    <!-- ============ NAVBAR ============ -->
    <nav class="navbar">

    <!-- ============ CONTACT HERO ============ -->
    <section class="contact-hero reveal">

      <h1>Mari Terhubung</h1>

        <!-- GANTI INI: sesuaikan kalimatnya kalau mau lebih personal -->
        Punya project menarik, ide kolaborasi, atau cuma mau say hi? Kabar dari kamu selalu saya tunggu.
      </p>

          <svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"></rect><polyline points="2,4 12,13 22,4"></polyline></svg>
        </a>
        <!-- GANTI INI: isi link asli GitHub/LinkedIn/WhatsApp kamu -->

  </div>

  <script src="script-v4.js"></script>
